<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ac:#0f6e56;--bd:#ddd9cf;--dn:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b19;--card:#262624;--tx:#f0eee8;--mu:#a3a198;--ac:#4fc3a1;--bd:#3a3a36;--dn:#f2877f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;padding:12px;max-width:560px;margin-inline:auto}
h1{font-size:19px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 6px;text-align:center}
.st b{display:block;font-size:15px;margin-top:4px;color:var(--ac)}
.st span{font-size:12px;color:var(--mu)}
.tot{text-align:center;margin:10px 0;color:var(--mu);font-size:13px}
.tot b{color:var(--tx);font-size:17px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-family:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font-family:inherit;font-size:16px;border:0;border-radius:10px;padding:12px;cursor:pointer}
.pri{background:var(--ac);color:#fff;width:100%;margin-top:12px;font-weight:700}
.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:6px 12px;font-size:13px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--tx)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.it{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.it:last-child{border:0}
.it small{color:var(--mu);display:block;font-size:12px;margin-top:2px}
.it .a{font-weight:700;white-space:nowrap;text-align:left}
.it .x{background:none;color:var(--dn);padding:0 4px;font-size:12px;display:block;margin-top:2px}
.tg{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:4px 10px;margin:3px;font-size:13px}.tg b{color:var(--dn);margin-inline-start:6px;cursor:pointer}.mgt{font-size:13px;color:var(--mu);margin:12px 0 4px}.add{display:flex;gap:6px;margin-top:6px}.add button{padding:8px 14px;font-size:14px}.bar{display:flex;gap:6px;margin-top:6px}.bar select{flex:1}.bar button{padding:8px 12px;font-size:14px}.empty{color:var(--mu);text-align:center;padding:16px;font-size:14px}
#rep{position:fixed;left:-9999px;top:0;width:794px;color:#111;direction:rtl;font-family:Tahoma,Arial,sans-serif}
#rep .pg{width:794px;height:1123px;padding:36px;background:#fff;overflow:hidden;margin-bottom:10px}
#rep .tt{font-size:20px;font-weight:700;text-align:center;margin:0 0 6px}
#rep table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:12px}
#rep th{background:#0f6e56;color:#fff;padding:4px 6px;border:1px solid #0f6e56;line-height:18px}
#rep td{padding:4px 6px;border:1px solid #bbb;text-align:center;line-height:18px}
#rep tr:nth-child(even) td{background:#f4f4f1}
#rep tr.t td{background:#e3f1ec;font-weight:700}
</style>

function ser(s){var p=s.split("-");return Math.round((Date.UTC(+p[0],p[1]-1,+p[2])-Date.UTC(1899,11,30))/864e5)}
function unser(v){if(typeof v=="number"){var d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.toISOString().slice(0,10)}
 var m=String(v).trim().match(/(\d+)\/(\d+)\/(\d+)/);return m?m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2):null}
$("xl").onclick=async function(){
 var dl=null;try{dl=await claude.use("downloads")}catch(e){}
 if(!dl){$("msg").textContent="الحفظ غير متاح هنا";return}
 var S=E.slice().sort(function(a,b){return a.d.localeCompare(b.d)||a.id-b.id});
 var rows=[["التاريخ","البند","القسم","دفع","المبلغ"]].concat(S.map(function(x){return[ser(x.d),x.item,x.cat,x.who,x.amt]}));
 var ws=XLSX.utils.aoa_to_sheet(rows);
 for(var r=2;r<=rows.length;r++)ws["A"+r].z="dd/mm/yyyy";
 ws["!cols"]=[{wch:12},{wch:32},{wch:16},{wch:10},{wch:14}];
 var R="'المصاريف'!",n=rows.length;
 var sm=[["الشريك","الإجمالي"]];
 WHO.forEach(function(w){sm.push([w,{t:"n",v:sum(E.filter(function(x){return x.who==w})),f:"SUMIF("+R+"D2:D5000,A"+(sm.length+1)+","+R+"E2:E5000)"}])});
 sm.push(["الإجمالي",{t:"n",v:sum(E),f:"SUM(B2:B"+(WHO.length+1)+")"}]);
 sm.push([],["القسم","الإجمالي"]);
 CATS.forEach(function(c){sm.push([c,{t:"n",v:sum(E.filter(function(x){return x.cat==c})),f:"SUMIF("+R+"C2:C5000,A"+(sm.length+1)+","+R+"E2:E5000)"}])});
 var ws2=XLSX.utils.aoa_to_sheet(sm);ws2["!cols"]=[{wch:20},{wch:16}];
 var wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
 XLSX.utils.book_append_sheet(wb,ws,"المصاريف");XLSX.utils.book_append_sheet(wb,ws2,"الملخص");
 try{await dl.save({filename:bname()+" "+dstamp()+".xlsx",data:XLSX.write(wb,{bookType:"xlsx",type:"array"})});$("msg").textContent="تم ✓"}catch(e){$("msg").textContent="تم الإلغاء"}
};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=async function(){
 var f=this.files[0];if(!f)return;
 try{
  var wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),ws=wb.Sheets["المصاريف"]||wb.Sheets[wb.SheetNames[0]];
  var rows=XLSX.utils.sheet_to_json(ws,{header:1}).slice(1),N=[];
  rows.forEach(function(r,k){var d=unser(r[0]),a=parseFloat(r[4]);if(d&&a>0&&r[1])N.push({id:k+1,d:d,item:String(r[1]),cat:String(r[2]||"نثريات"),who:String(r[3]||"رفعت"),amt:a})});
  if(!N.length){$("msg").textContent="الملف مفيهوش بيانات صالحة";return}
  if(confirm("استبدال البيانات الحالية بـ "+N.length+" مصروف من الملف؟")){N.forEach(function(x){if(WHO.indexOf(x.who)<0)WHO.push(x.who);if(CATS.indexOf(x.cat)<0)CATS.push(x.cat)});saveLists();applyLists({});$("msg").textContent="جاري الاستيراد…";await replaceAll(N);$("msg").textContent="تم الاستيراد ✓"}
 }catch(e){$("msg").textContent="مقدرتش أقرأ الملف"}
 this.value="";
};
opts($("w"),WHO);opts($("c"),CATS);
$("d").value=new Date().toISOString().slice(0,10);

function LKf(){return CUR=="main"?"lists2":"lists_"+CUR}
function fillSel(){var w=$("w").value,c=$("c").value;opts($("w"),WHO);opts($("c"),CATS);if(WHO.indexOf(w)>=0)$("w").value=w;if(CATS.indexOf(c)>=0)$("c").value=c}
function applyLists(o){
 if(o.who&&o.who.length)WHO=o.who;if(o.cats&&o.cats.length)CATS=o.cats;
 if(o.cont)CONT=o.cont.map(function(x){return[x.n,x.k]});
 fillSel();render();renderMgr();
}
function saveLists(){
 var o={who:WHO,cats:CATS,cont:CONT.map(function(c){return{n:c[0],k:c[1]}})};
 if(DB)DB.collection("meta").doc(lk()).set(o).catch(function(){$("msg").textContent="فشل حفظ القوائم"});
 else try{localStorage.setItem(LKf(),JSON.stringify(o))}catch(e){}
}
function loadLocalLists(){try{var s=localStorage.getItem(LKf());if(s)applyLists(JSON.parse(s))}catch(e){}}
function grp(t,k,arr,ph){
 return '<div class="mgt">'+t+'</div>'+arr.map(function(n){return '<span class="tg">'+n+'<b data-rm="'+k+'|'+n+'">✕</b></span>'}).join("")+'<div class="add"><input id="n_'+k+'" placeholder="'+ph+'"><button class="sec" data-add="'+k+'">إضافة</button></div>';
}
function renderMgr(){
 $("mgp").innerHTML=grp("الشركاء","who",WHO,"اسم شريك جديد")+grp("الأقسام","cats",CATS,"اسم قسم جديد")+grp("المقاولين (للـ PDF)","cont",CONT.map(function(c){return c[0]}),"اسم مقاول (يظهر في البند)")+'<div class="mgt">المقاول بيتجمّع في الـ PDF من المصاريف اللي البند فيها اسمه.</div>';
}
$("mg").onclick=function(){var p=$("mgp");p.style.display=p.style.display=="none"?"block":"none"};
document.addEventListener("click",function(e){
 var a=e.target.getAttribute("data-add"),r=e.target.getAttribute("data-rm");
 if(a){
  var v=$("n_"+a).value.trim();if(!v)return;
  var L=a=="who"?WHO:a=="cats"?CATS:CONT.map(function(c){return c[0]});
  if(L.indexOf(v)>=0){$("msg").textContent="موجود بالفعل";return}
  if(a=="cont")CONT.push([v,[v]]);else L.push(v);
  saveLists();fillSel();render();renderMgr();
 }
 if(r){
  var k=r.split("|")[0],n=r.slice(k.length+1);
  if(!confirm("حذف "+n+"؟"))return;
  if(k=="who"||k=="cats"){
   var used=E.some(function(x){return(k=="who"?x.who:x.cat)==n});
   if(used){alert("مينفعش تتمسح: فيه مصاريف مسجلة عليها");return}
   var L2=k=="who"?WHO:CATS;if(L2.length<2)return;
   L2.splice(L2.indexOf(n),1);
  }else CONT=CONT.filter(function(c){return c[0]!=n});
  saveLists();fillSel();render();renderMgr();
 }
});
var DB=null;
function col(){return DB.collection(ek())}
function put(x){if(DB){col().doc("e"+x.id).set(x).catch(function(){$("msg").textContent="فشل الحفظ"})}else{E.push(x);save();render()}}
function rm(id){if(DB){col().doc("e"+id).delete().catch(function(){$("msg").textContent="فشل الحذف"})}else{E=E.filter(function(y){return y.id!=id});save();render()}}
async function batch(arr,fn){for(var i=0;i<arr.length;i+=20)await Promise.all(arr.slice(i,i+20).map(fn))}
async function replaceAll(N){
 if(!DB){E=N;save();render();return}
 await batch(E,function(x){return col().doc("e"+x.id).delete()});
 await batch(N,function(x){return col().doc("e"+x.id).set(x)});
}
async function firstSeed(){
 var m=DB.collection("meta").doc("state"),s=await m.get();
 if(s.exists)return;
 $("msg").textContent="جاري تحميل البيانات لأول مرة…";
 var arr=seed(),old=[];
 try{old=JSON.parse(localStorage.getItem("ledger2")||"[]").filter(function(x){return x.id>1e12})}catch(e){}
 await batch(arr.concat(old),function(x){return col().doc("e"+x.id).set(x)});
 await m.set({seeded:true});$("msg").textContent="";
}
var BLD=[{id:"main",name:"عمارة الحاج رفعت"}],CUR="main",unE=null,unL=null,bInit=false;
var DEF={who:WHO.slice(),cats:CATS.slice(),cont:CONT.map(function(c){return{n:c[0],k:c[1]}})};
function cname(){for(var i=0;i<BLD.length;i++)if(BLD[i].id==CUR)return BLD[i].name;return BLD[0].name}
function bname(){return cname().replace(/[\\\/:*?"<>|]/g,"-")}
function ek(){return CUR=="main"?"entries":"entries_"+CUR}
function lk(){return CUR=="main"?"lists":"lists_"+CUR}
function lsk(){return CUR=="main"?"ledger2":"ledger_"+CUR}
function renderBar(){
 var s=$("bsel");s.innerHTML="";BLD.forEach(function(b){s.appendChild(new Option(b.name,b.id))});s.value=CUR;

}
function saveB(){if(DB)DB.collection("meta").doc("buildings").set({list:BLD}).catch(function(){$("msg").textContent="فشل حفظ العمارات"});else try{localStorage.setItem("blds",JSON.stringify(BLD))}catch(e){}}
function switchB(id){
 if(unE){unE();unE=null}if(unL){unL();unL=null}
 CUR=id;F="الكل";E=[];try{localStorage.setItem("curB",id)}catch(e){}
 if(location.hash.slice(1)!=id)location.hash=id;
 WHO=DEF.who.slice();CATS=DEF.cats.slice();CONT=DEF.cont.map(function(x){return[x.n,x.k]});
 fillSel();renderBar();render();renderMgr();
 if(!DB){loadLocalLists();load();render();return}
 $("list").innerHTML='<div class="empty">جاري التحميل…</div>';
 var first=true;
 unL=DB.collection("meta").doc(lk()).onSnapshot(function(s){applyLists(s.exists?s.data():DEF)});
 unE=DB.collection(ek()).onSnapshot(function(s){
  E=s.docs.map(function(d){return d.data()});render();
  if(first){first=false;if(id=="main"&&s.empty)firstSeed().catch(function(){$("msg").textContent="فشل التحميل الأول، أعد فتح الصفحة"})}
 },function(){$("msg").textContent="مشكلة في الاتصال"});
}
function validB(h){return BLD.some(function(b){return b.id==h})?h:"main"}
$("bsel").onchange=function(){switchB(this.value)};

 $("dt").textContent=t;$("di").value=def||"";$("dlg").style.display="flex";setTimeout(function(){$("di").focus()},50);

 ask("اسم العمارة الجديدة؟","",function(n){
  var id="b"+Date.now().toString(36),o={who:WHO.slice(),cats:CATS.slice(),cont:[]};
  BLD.push({id:id,name:n});saveB();
  if(DB)DB.collection("meta").doc("lists_"+id).set(o);else try{localStorage.setItem("lists_"+id,JSON.stringify(o))}catch(e){}
  switchB(id);$("msg").textContent="تمت إضافة "+n+" ✓";
 });

$("bren").onclick=function(){
 ask("اسم العمارة:",cname(),function(n){
  BLD.forEach(function(b){if(b.id==CUR)b.name=n});saveB();renderBar();
 });
};
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(h&&h!=CUR&&BLD.some(function(b){return b.id==h}))switchB(h)});
async function init(){
 try{DB=await claude.use("db")}catch(e){}
 var h="main";try{h=location.hash.slice(1)||localStorage.getItem("curB")||"main"}catch(e){}
 if(!DB){try{var b=JSON.parse(localStorage.getItem("blds")||"null");if(b&&b.length)BLD=b}catch(e){}switchB(validB(h));return}
 $("list").innerHTML='<div class="empty">جاري التحميل…</div>';
 DB.collection("meta").doc("buildings").onSnapshot(function(s){
  if(s.exists&&s.data().list&&s.data().list.length)BLD=s.data().list;
  if(!bInit){bInit=true;switchB(validB(h))}else renderBar();
 },function(){$("msg").textContent="مشكلة في الاتصال"});
}
init();
</script>
